name: Deploy Stats
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging, production]
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: stats-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: stats-${{ inputs.environment }}
    env:
      STATS_ENV: ${{ inputs.environment }}
      STATS_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      TABLE_NAME: ${{ vars.PUNCHER_TABLE_NAME }}
      PUNCHER_TABLE_ARN: ${{ vars.PUNCHER_TABLE_ARN }}
      SOURCE_REGION: ${{ vars.PUNCHER_TABLE_REGION }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
      STATS_DOMAIN: ${{ vars.STATS_DOMAIN }}
      GOOGLE_CLIENT_ID: ${{ vars.STATS_GOOGLE_CLIENT_ID }}
      STATS_CERTIFICATE_ARN: ${{ vars.STATS_CERTIFICATE_ARN }}
      PUNCHER_URL: ${{ vars.PUNCHER_URL }}
      ALERT_EMAIL: ${{ vars.STATS_ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STATS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - run: npm run cdk:synth
      - run: npx cdk diff --all
      - run: npm run cdk:deploy -- --require-approval never
